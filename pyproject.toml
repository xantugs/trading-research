[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "orb-backtest"
version = "2.0.0a1"
description = "Opening Range Breakout research with broker-data validation and MT5 tools"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11,<3.14"
dependencies = ["numpy>=1.26,<2.4", "pandas>=2.2,<3", "tzdata>=2025.1"]

[project.optional-dependencies]
wrds = ["pyarrow>=16,<26"]
research = ["plotly>=5.24,<7"]
research-v2 = ["MetaTrader5>=5.0.45; sys_platform == 'win32'", "pyarrow>=16,<26", "plotly>=5.24,<7"]
dev = ["pytest>=8,<10", "ruff>=0.9,<1", "build>=1.2,<2", "plotly>=5.24,<7", "pyarrow>=16,<26"]
mt5 = ["MetaTrader5>=5.0.45; sys_platform == 'win32'"]

[tool.setuptools.packages.find]
include = ["orb*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
ignore = ["E741"]
