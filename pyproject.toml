[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "orb-backtest"
version = "1.4.0"
description = "Opening Range Breakout research kit for Python and MetaTrader 5"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11,<3.14"
dependencies = ["numpy>=1.26,<2.4", "pandas>=2.2,<3", "tzdata>=2025.1"]

[project.optional-dependencies]
app = ["streamlit>=1.50,<2", "plotly>=5.24,<7"]
dev = ["pytest>=8,<10", "ruff>=0.9,<1", "build>=1.2,<2"]
mt5 = ["MetaTrader5>=5.0.45; sys_platform == 'win32'"]

[tool.setuptools.packages.find]
include = ["orb*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
ignore = ["E741"]
