[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "trading-research"
version = "2.0.0a1"
description = "Pre-registered trading research: ORB, S2 intraday momentum, ML and chart-image CNNs"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11,<3.14"
dependencies = ["numpy>=1.26,<2.4", "pandas>=2.2,<3", "tzdata>=2025.1"]

[project.optional-dependencies]
research-v2 = ["MetaTrader5>=5.0.45; sys_platform == 'win32'", "pyarrow>=16,<26", "plotly>=5.24,<7"]
ml = ["xgboost>=3,<4", "scikit-learn>=1.5,<2", "torch>=2.4,<3"]
wrds = ["psycopg2-binary>=2.9,<3", "pyarrow>=16,<26"]
dev = ["pytest>=8,<10", "ruff>=0.9,<1", "build>=1.2,<2", "plotly>=5.24,<7", "pyarrow>=16,<26"]

[tool.setuptools.packages.find]
include = ["orb_research*", "webapp*"]

[tool.setuptools.package-data]
webapp = ["static/*.html", "static/*.css", "static/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
ignore = ["E741"]
