name: Python checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -e ".[dev,wrds]"
      - run: python -m ruff check .
      - run: python -m pytest -q
      - run: python run_all.py --no-install --no-app --source demo --demo-days 10 --output outputs/ci-smoke
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: synthetic-report-${{ matrix.os }}-${{ matrix.python }}
          path: outputs/ci-smoke
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install build
      - run: python -m build
